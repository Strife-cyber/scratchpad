<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratchpad Trace Viewer</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1d2129;
    --border: #2a2f3a;
    --text: #d7dbe2;
    --text-dim: #8b93a1;
    --accent: #5b9dff;
    --ok: #3fb96a;
    --err: #ff6b6b;
    --warn: #ffb454;
    --net: #6aa8ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .stat { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--text-dim); }
  .stat b { font-size: 16px; color: var(--text); font-weight: 600; }
  #drop {
    margin: 20px;
    padding: 60px 20px;
    text-align: center;
    border: 2px dashed var(--border);
    border-radius: 12px;
    color: var(--text-dim);
    transition: border-color .15s, background .15s;
  }
  #drop.over { border-color: var(--accent); background: var(--panel-2); }
  #drop .big { font-size: 15px; color: var(--text); margin-bottom: 6px; }
  #drop label { color: var(--accent); cursor: pointer; text-decoration: underline; }
  #view { display: none; }
  #meta { padding: 14px 20px; display: flex; gap: 24px; flex-wrap: wrap; }
  #main { display: grid; grid-template-columns: minmax(340px, 46%) 1fr; gap: 0; }
  @media (max-width: 900px) { #main { grid-template-columns: 1fr; } }
  .col { padding: 16px 20px; min-width: 0; }
  .col + .col { border-left: 1px solid var(--border); }
  @media (max-width: 900px) { .col + .col { border-left: none; border-top: 1px solid var(--border); } }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); margin: 0 0 12px; }
  /* Timeline of steps */
  .step {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 9px 10px; border-radius: 8px;
    border: 1px solid transparent;
    cursor: pointer;
  }
  .step:hover { background: var(--panel); }
  .step.selected { background: var(--panel-2); border-color: var(--accent); }
  .step .seq { font-family: ui-monospace, "Cascadia Code", monospace; color: var(--text-dim); font-size: 12px; min-width: 30px; padding-top: 2px; }
  .step .body { min-width: 0; flex: 1; }
  .step .label { word-break: break-word; }
  .step .sub { color: var(--text-dim); font-size: 12px; margin-top: 2px; display: flex; gap: 12px; flex-wrap: wrap; }
  .step .screenshot-thumb { margin-top: 8px; max-width: 180px; border: 1px solid var(--border); border-radius: 6px; display: block; }
  .badge {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text-dim);
    white-space: nowrap;
  }
  .badge.err { color: var(--err); border-color: var(--err); background: rgba(255,107,107,.08); }
  .badge.ok { color: var(--ok); border-color: var(--ok); background: rgba(63,185,106,.08); }
  .badge.warn { color: var(--warn); border-color: var(--warn); background: rgba(255,180,84,.08); }
  /* Network bars */
  #net-track { position: relative; height: 120px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .netbar { position: absolute; bottom: 0; background: var(--net); border-radius: 2px 2px 0 0; min-width: 2px; }
  .netbar:hover { filter: brightness(1.3); }
  #net-axis { display: flex; justify-content: space-between; color: var(--text-dim); font-size: 11px; margin-top: 4px; font-family: ui-monospace, monospace; }
  .errlist { list-style: none; margin: 0; padding: 0; }
  .errlist li { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; background: var(--panel); }
  .errlist .msg { color: var(--err); }
  .errlist .step-label { color: var(--text-dim); font-size: 12px; margin-top: 3px; }
  /* Screenshot detail */
  #shot { max-width: 100%; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
  #shot-name { color: var(--text-dim); font-size: 12px; margin-top: 6px; word-break: break-all; }
  .empty { color: var(--text-dim); }
  code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Scratchpad Trace Viewer</h1>
  <div class="stat"><b id="st-session">–</b>session</div>
  <div class="stat"><b id="st-steps">0</b>steps</div>
  <div class="stat"><b id="st-errors">0</b>errors</div>
  <div class="stat"><b id="st-net">0</b>network requests</div>
  <div class="stat"><b id="st-dur">0s</b>duration</div>
</header>

<div id="drop">
  <div class="big">Drop a <code>.spz</code> trace archive here</div>
  <div>or <label for="file">choose a file</label></div>
  <input id="file" type="file" accept=".spz,.zip" hidden>
</div>

<div id="view">
  <div id="meta">
    <div class="stat"><b id="m-path">–</b>bundle</div>
    <div class="stat"><b id="m-timeline">–</b>timeline</div>
    <div class="stat"><b id="m-trace">–</b>trace</div>
  </div>
  <div id="main">
    <div class="col">
      <h2>Steps</h2>
      <div id="steps"></div>
      <h2 style="margin-top:20px">Network</h2>
      <div id="net-track"></div>
      <div id="net-axis"></div>
      <div id="net-list" style="margin-top:10px;font-size:12px;color:var(--text-dim)"></div>
    </div>
    <div class="col">
      <h2>Selected step</h2>
      <img id="shot" alt="" style="display:none">
      <div id="shot-name"></div>
      <div id="shot-empty" class="empty">Select a step to see its screenshot and details.</div>
      <h2 style="margin-top:20px">Errors</h2>
      <div id="errors"><div class="empty">No errors recorded.</div></div>
    </div>
  </div>
</div>

<script>
"use strict";

/* ------------------------------------------------------------------ *
 * Minimal ZIP reader (no external libraries). Supports the two methods
 * ZIP uses in practice: stored (0) and deflate (8). Deflate entries are
 * inflated via DecompressionStream (Chrome 103+, Firefox 113+, Safari 16.4+).
 * ------------------------------------------------------------------ */
const u16 = (b, o) => b[o] | (b[o + 1] << 8);
const u32 = (b, o) => (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0;

function findEOCD(buf) {
  const sig = 0x06054b50;
  const start = Math.max(0, buf.length - 65557);
  for (let i = buf.length - 22; i >= start; i--) {
    if (u32(buf, i) === sig) return i;
  }
  throw new Error("not a zip archive (end-of-central-directory not found)");
}

async function inflateRaw(data) {
  if (!("DecompressionStream" in window)) {
    throw new Error("this browser lacks DecompressionStream — cannot inflate the .spz");
  }
  const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function readZip(buf) {
  const eocd = findEOCD(buf);
  const count = u16(buf, eocd + 10);
  let p = u32(buf, eocd + 16);
  const central = new Map();
  for (let i = 0; i < count; i++) {
    if (p + 46 > buf.length) throw new Error("truncated central directory");
    const method = u16(buf, p + 10);
    const compSize = u32(buf, p + 20);
    const nameLen = u16(buf, p + 28);
    const extraLen = u16(buf, p + 30);
    const commentLen = u16(buf, p + 32);
    const localOff = u32(buf, p + 42);
    const name = new TextDecoder().decode(buf.subarray(p + 46, p + 46 + nameLen));
    const lnLen = u16(buf, localOff + 26);
    const leLen = u16(buf, localOff + 28);
    const dataStart = localOff + 30 + lnLen + leLen;
    central.set(name, { method, data: buf.subarray(dataStart, dataStart + compSize) });
    p += 46 + nameLen + extraLen + commentLen;
  }
  const out = {};
  for (const [name, e] of central) {
    out[name] = e.method === 8 ? await inflateRaw(e.data) : e.data;
  }
  return out;
}

function text(bytes) { return new TextDecoder().decode(bytes); }
function blobURL(bytes, mime) { return URL.createObjectURL(new Blob([bytes], { type: mime })); }

/* ------------------------------------------------------------------ *
 * Viewer state + rendering
 * ------------------------------------------------------------------ */
let state = null;

const $ = (id) => document.getElementById(id);

function stepSummary(ev) {
  if (ev.type === "navigate") return `navigate ${ev.url}`;
  if (ev.type === "action") {
    const sel = ev.selector ? describeSelector(ev.selector) : "";
    return sel ? `action ${ev.action} on ${sel}` : `action ${ev.action}`;
  }
  if (ev.type === "exception") return "exception";
  if (ev.type === "observe") return "observe";
  return ev.type || ev.action || "step";
}

function describeSelector(s) {
  if (!s) return "";
  if (s.css) return `css=${s.css}`;
  if (s.xpath) return `xpath=${s.xpath}`;
  if (s.text) return `text="${s.text}"`;
  if (s.role) return `role=${s.role}`;
  if (s.test_id) return `test_id=${s.test_id}`;
  if (s.placeholder) return `placeholder=${s.placeholder}`;
  return "";
}

function fmtDuration(ms) {
  if (ms == null) return "";
  if (ms < 1000) return `${ms}ms`;
  return (ms / 1000).toFixed(1) + "s";
}

function render(data) {
  state = data;
  const events = data.timeline || [];
  const summary = data.summary || {};
  const net = summary.network || [];

  $("st-steps").textContent = events.length;
  $("st-errors").textContent = (summary.errors || []).length;
  $("st-net").textContent = net.length;
  const dur = data.durationMs || 0;
  $("st-dur").textContent = fmtDuration(dur);

  // Steps list.
  const stepsEl = $("steps");
  stepsEl.innerHTML = "";
  let firstShot = null;
  events.forEach((ev) => {
    const row = document.createElement("div");
    row.className = "step";
    const seq = document.createElement("div");
    seq.className = "seq";
    seq.textContent = ev.seq;
    const body = document.createElement("div");
    body.className = "body";
    const label = document.createElement("div");
    label.className = "label";
    label.textContent = stepSummary(ev);
    body.appendChild(label);
    const sub = document.createElement("div");
    sub.className = "sub";
    if (ev.timestamp) sub.appendChild(elText(ev.timestamp.replace("T", " ").slice(0, 19)));
    if (ev.duration_ms != null) sub.appendChild(elBadge("ok", fmtDuration(ev.duration_ms)));
    if (ev.error) sub.appendChild(elBadge("err", "error"));
    if (ev.type === "observe") sub.appendChild(elBadge("warn", "observe"));
    body.appendChild(sub);

    // Screenshot thumbnail attached to the step.
    let shotBytes = null;
    let shotName = "";
    if (ev.screenshot_path) {
      const base = ev.screenshot_path.split(/[\\/]/).pop();
      const entry = data.screenshots[`screenshots/${base}`] || data.screenshots[base];
      if (entry) { shotBytes = entry; shotName = base; }
    }
    if (shotBytes) {
      const img = document.createElement("img");
      img.className = "screenshot-thumb";
      img.src = blobURL(shotBytes, "image/png");
      img.alt = "step screenshot";
      body.appendChild(img);
      if (!firstShot) firstShot = { ev, shotBytes, shotName };
    }

    row.appendChild(seq);
    row.appendChild(body);
    row.addEventListener("click", () => selectStep(ev, shotBytes, shotName));
    stepsEl.appendChild(row);
  });
  if (stepsEl.children.length === 0) {
    stepsEl.innerHTML = '<div class="empty">No steps recorded.</div>';
  }

  // Select the first step that has a screenshot, else the first step.
  if (firstShot) selectStep(firstShot.ev, firstShot.shotBytes, firstShot.shotName);
  else if (events.length) selectStep(events[0], null, "");

  renderNetwork(net, data.durationMs || 0);
  renderErrors(summary.errors || []);
}

function selectStep(ev, shotBytes, shotName) {
  document.querySelectorAll(".step").forEach((r) => r.classList.remove("selected"));
  // Highlight the matching row.
  const rows = document.querySelectorAll(".step .seq");
  rows.forEach((el) => {
    if (parseInt(el.textContent, 10) === ev.seq) el.parentElement.classList.add("selected");
  });
  if (shotBytes) {
    $("shot").src = blobURL(shotBytes, "image/png");
    $("shot").style.display = "";
    $("shot-name").textContent = shotName;
    $("shot-empty").style.display = "none";
  } else {
    $("shot").style.display = "none";
    $("shot-name").textContent = "";
    $("shot-empty").style.display = "";
    $("shot-empty").textContent = "No screenshot for this step.";
  }
}

function renderNetwork(net, totalMs) {
  const track = $("net-track");
  const axis = $("net-axis");
  const list = $("net-list");
  track.innerHTML = "";
  axis.innerHTML = "";
  list.innerHTML = "";
  if (!net.length) {
    track.innerHTML = '<div class="empty" style="padding:12px">No network activity captured.</div>';
    return;
  }
  const maxEnd = Math.max(totalMs, ...net.map((n) => n.start_ms + n.duration_ms));
  const width = track.clientWidth - 4;
  net.forEach((n) => {
    const bar = document.createElement("div");
    bar.className = "netbar";
    const h = Math.max(4, Math.round((n.duration_ms / maxEnd) * 100));
    const x = Math.max(0, Math.round((n.start_ms / maxEnd) * width));
    bar.style.left = x + "px";
    bar.style.width = Math.max(2, Math.round((n.duration_ms / maxEnd) * width)) + "px";
    bar.style.height = h + "px";
    bar.title = `${n.url}\n${fmtDuration(n.duration_ms)}${n.status ? " · " + n.status : ""}`;
    track.appendChild(bar);
  });
  axis.innerHTML = `<span>0ms</span><span>${fmtDuration(maxEnd)}</span>`;
  // Slowest first, top 8.
  const top = [...net].sort((a, b) => b.duration_ms - a.duration_ms).slice(0, 8);
  top.forEach((n) => {
    const line = document.createElement("div");
    line.textContent = `${String(n.duration_ms).padStart(5)}ms  ${n.url}${n.status ? " (" + n.status + ")" : ""}`;
    list.appendChild(line);
  });
  if (net.length > top.length) list.insertAdjacentHTML("beforeend",
    `<div>+${net.length - top.length} more</div>`);
}

function renderErrors(errors) {
  const el = $("errors");
  el.innerHTML = "";
  if (!errors.length) {
    el.innerHTML = '<div class="empty">No errors recorded.</div>';
    return;
  }
  const ul = document.createElement("ul");
  ul.className = "errlist";
  errors.forEach((e) => {
    const li = document.createElement("li");
    const msg = document.createElement("div");
    msg.className = "msg";
    msg.textContent = e.message;
    li.appendChild(msg);
    if (e.step) {
      const lbl = document.createElement("div");
      lbl.className = "step-label";
      lbl.textContent = e.step;
      li.appendChild(lbl);
    }
    ul.appendChild(li);
  });
  el.appendChild(ul);
}

function elText(s) { const el = document.createElement("span"); el.textContent = s; return el; }
function elBadge(kind, text) {
  const b = document.createElement("span");
  b.className = `badge ${kind}`;
  b.textContent = text;
  return b;
}

/* ------------------------------------------------------------------ *
 * Load + parse a .spz
 * ------------------------------------------------------------------ */
async function loadBundle(buf, name) {
  let files;
  try {
    files = await readZip(buf);
  } catch (e) {
    alert("Could not parse this archive: " + e.message);
    throw e;
  }

  let timeline = [];
  if (files["timeline.jsonl"]) {
    const lines = text(files["timeline.jsonl"]).split("\n").filter((l) => l.trim());
    timeline = lines.map((l) => JSON.parse(l));
  }

  let summary = {};
  if (files["summary.json"]) {
    try { summary = JSON.parse(text(files["summary.json"])); } catch (_) { /* tolerate */ }
  }

  // Screenshot entry map (name -> bytes), for thumbnail lookup.
  const screenshots = {};
  Object.keys(files).forEach((k) => {
    if (k.startsWith("screenshots/")) screenshots[k] = files[k];
  });

  const sessionId = summary.session_id || (name || "session").replace(/\.spz$/, "");
  const durationMs = summary.duration_ms || 0;

  $("st-session").textContent = sessionId;
  $("m-path").textContent = name || "–";
  $("m-timeline").textContent = `${timeline.length} event(s)`;
  $("m-trace").textContent = files["trace.json.gz"] ? "trace.json.gz" : "—";

  $("drop").style.display = "none";
  $("view").style.display = "block";

  render({ timeline, summary, screenshots, durationMs, sessionId });
}

/* ------------------------------------------------------------------ *
 * Drag & drop + file input
 * ------------------------------------------------------------------ */
const drop = $("drop");
["dragenter", "dragover"].forEach((evt) =>
  drop.addEventListener(evt, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((evt) =>
  drop.addEventListener(evt, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => {
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) f.arrayBuffer().then((b) => loadBundle(new Uint8Array(b), f.name));
});
$("file").addEventListener("change", (e) => {
  const f = e.target.files && e.target.files[0];
  if (f) f.arrayBuffer().then((b) => loadBundle(new Uint8Array(b), f.name));
});
</script>
</body>
</html>
